[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-builder"
version = "0.2.0"
description = "Web UI to design, test and export AI agents with a small, provider-pluggable Python harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "thara" }]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
keywords = ["ai", "agents", "llm", "claude", "harness", "tool-use"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness-builder = "builder.app:main"
harness-run = "harness.cli:main"

[project.urls]
Homepage = "https://github.com/thaaaru/agent-harness-builder"
Issues = "https://github.com/thaaaru/agent-harness-builder/issues"

[tool.setuptools.packages.find]
include = ["harness*", "builder*"]

[tool.setuptools.package-data]
builder = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
